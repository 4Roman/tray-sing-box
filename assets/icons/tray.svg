<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Source of truth for all app icons. tools/genicons renders this into
       assets/icons/tray.ico (multi-size: tray icon at runtime + exe icon via go-winres).
       Pixel-art recreation of the original 16x16 icon: black "4R" on orange. -->
  <rect width="16" height="16" fill="#FFA500"/>
  <g fill="#000000">
    <!-- "4" -->
    <rect x="6" y="3" width="1" height="9"/>
    <rect x="5" y="4" width="1" height="1"/>
    <rect x="4" y="5" width="1" height="1"/>
    <rect x="3" y="6" width="1" height="1"/>
    <rect x="2" y="7" width="1" height="2"/>
    <rect x="2" y="9" width="6" height="1"/>
    <!-- "R" -->
    <rect x="9" y="3" width="1" height="9"/>
    <rect x="10" y="3" width="4" height="1"/>
    <rect x="14" y="4" width="1" height="3"/>
    <rect x="10" y="7" width="4" height="1"/>
    <rect x="11" y="8" width="1" height="1"/>
    <rect x="12" y="9" width="1" height="1"/>
    <rect x="13" y="10" width="1" height="1"/>
    <rect x="14" y="11" width="1" height="1"/>
  </g>
</svg>
