name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (a moved tag cannot swap the code that
# builds the exe); the token only reads
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        # -short skips e2e tests that need network/a real sing-box install;
        # autostart/clipboard tests detect the CI session and degrade gracefully
        run: go test -short ./...

      - name: Render icon
        # Before the build: the icons are embedded into the exe (package assets)
        run: go run ./tools/genicons

      - name: Test the systray fork
        # A module of its own (go.mod replace): not part of ./... above. Needs
        # the rendered icon (TestIconFromBytes builds a real HICON from it)
        shell: pwsh
        run: |
          go work init . ./third_party/systray
          go test github.com/getlantern/systray
          Remove-Item go.work, go.work.sum -ErrorAction SilentlyContinue

      - name: Build
        shell: pwsh
        run: |
          $version = git describe --tags --always --dirty
          go build -trimpath -ldflags="-H windowsgui -X tray-sing-box/internal/config.Version=$version" -o bin/tray-sing-box.exe .

      - name: Embed Windows resources
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres patch --in build/winres/winres.json --no-backup bin/tray-sing-box.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-sing-box
          path: bin/tray-sing-box.exe
