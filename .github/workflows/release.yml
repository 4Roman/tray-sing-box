name: Release

# Builds a DRAFT GitHub release for every "v<major>.<minor>.<patch>" tag with
# the exe the app's self-update expects (internal/infrastructure/selfupdate)
# and the installer:
#   tray-sing-box-<version>-windows-amd64.exe
#   tray-sing-box-<version>-setup.exe
#
# CI deliberately does NOT sign. The signature exists to protect elevated
# clients from a compromised GitHub account — and such an account could push
# a tag and have CI sign anything. So the private key never lives in GitHub:
# the maintainer finishes the draft OFFLINE with
#   build\release\finish-release.ps1 -Tag vX.Y.Z -KeyFile <private key file>
# which rebuilds the exe from the tag and signs only when it is bit-identical
# to this job's exe (the build is reproducible: -trimpath, the go.mod
# toolchain, CGO_ENABLED as on the runner, go-winres v0.3.3 — keep the Build
# step and that script in sync), builds the installer locally from it,
# uploads checksums.txt + checksums.txt.sig and publishes.
# Clients ignore drafts and refuse releases without a valid signature, so a
# forgotten step yields "no update", never a bad update.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tag is data, not code: validated and passed through the
      # environment rather than interpolated into the script
      - name: Validate tag and configuration
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "release tags must look like v1.2.3, got '$env:VERSION'" }
          # A release built without the public key could never update itself
          # to the next one — refuse to strand the first users
          $cfg = Get-Content internal/config/config.go -Raw
          if ($cfg -match 'AppUpdateRepo\s*=\s*""' -or $cfg -match 'AppUpdatePublicKey\s*=\s*""') {
            throw "config.AppUpdateRepo / AppUpdatePublicKey are empty: run tools/relkey and fill them in before tagging a release"
          }

      - name: Test
        run: go test -short ./...

      - name: Render icons (embedded into the exe)
        run: go run ./tools/genicons

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-H windowsgui -X tray-sing-box/internal/config.Version=$env:VERSION" -o bin/tray-sing-box.exe .
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres patch --in build/winres/winres.json --no-backup bin/tray-sing-box.exe
          New-Item -ItemType Directory -Force dist | Out-Null
          $plain = $env:VERSION.TrimStart('v')
          Copy-Item bin/tray-sing-box.exe "dist/tray-sing-box-$plain-windows-amd64.exe"

      # The installer (Program Files + %ProgramData% layout, autostart task,
      # takeover of a portable copy) — see build/installer/tray-sing-box.iss
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Inno Setup pinned to the version the installer was tested with
          # (build/installer/sandbox), from the official release, checked by
          # hash and signature. Not the runner image's copy as is (its version
          # changes with the image) and not Chocolatey (its old pinned versions
          # disappear). ISCC.exe 6.7 has no version resource: the version and
          # the location come from the setup's uninstall entry
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha256 = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $sha256) { throw "Inno Setup installer: SHA-256 mismatch" }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw "Inno Setup installer: invalid signature" }
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$(Join-Path $env:RUNNER_TEMP 'innosetup')") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed with $($p.ExitCode)" }
          $entry = @('HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall') |
            ForEach-Object { Get-ItemProperty (Join-Path $_ 'Inno Setup 6_is1') -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $entry -or $entry.DisplayVersion -ne '6.7.3') { throw "Inno Setup 6.7.3 not registered (got '$($entry.DisplayVersion)')" }
          $iscc = Join-Path $entry.InstallLocation 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $($entry.InstallLocation)" }
          Write-Host "ISCC $($entry.DisplayVersion) at $iscc"
          $plain = $env:VERSION.TrimStart('v')
          & $iscc "/DVersion=$plain" "/DSource=..\..\dist\tray-sing-box-$plain-windows-amd64.exe" build\installer\tray-sing-box.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Publish draft (sign offline, then publish by hand)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
